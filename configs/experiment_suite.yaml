name: experiment_suite
title: "Единый экспериментальный отчёт: набор сценариев нагрузки"
description: >
  Набор сценариев для первичного экспериментального обоснования эффективности
  интеллектуального и адаптивного управления фазами светофора. Сценарии
  покрывают равномерный поток, низкую нагрузку, направленные часы пик и
  перегруженный перекрёсток.

simulation:
  duration_seconds: 900
  seeds: [1, 2, 3, 4, 5]
  service_time_seconds: 2.0

scenarios:
  - name: uniform_demo
    title: Равномерная нагрузка
    description: Все направления получают одинаковую интенсивность 6 автомобилей в минуту.
    intersection:
      lanes:
        north: {arrival_rate_per_minute: 6}
        south: {arrival_rate_per_minute: 6}
        east: {arrival_rate_per_minute: 6}
        west: {arrival_rate_per_minute: 6}
      min_green_seconds: 15
      yellow_seconds: 3

  - name: low_load
    title: Низкая нагрузка
    description: Все направления получают умеренный поток 3 автомобиля в минуту.
    intersection:
      lanes:
        north: {arrival_rate_per_minute: 3}
        south: {arrival_rate_per_minute: 3}
        east: {arrival_rate_per_minute: 3}
        west: {arrival_rate_per_minute: 3}
      min_green_seconds: 15
      yellow_seconds: 3

  - name: morning_peak_ns
    title: Утренний пик Север–Юг
    description: Основная нагрузка идёт по направлению Север–Юг, поперечный поток ниже.
    intersection:
      lanes:
        north: {arrival_rate_per_minute: 10}
        south: {arrival_rate_per_minute: 10}
        east: {arrival_rate_per_minute: 4}
        west: {arrival_rate_per_minute: 4}
      min_green_seconds: 15
      yellow_seconds: 3

  - name: evening_peak_ew
    title: Вечерний пик Восток–Запад
    description: Основная нагрузка идёт по направлению Восток–Запад, поток Север–Юг ниже.
    intersection:
      lanes:
        north: {arrival_rate_per_minute: 4}
        south: {arrival_rate_per_minute: 4}
        east: {arrival_rate_per_minute: 10}
        west: {arrival_rate_per_minute: 10}
      min_green_seconds: 15
      yellow_seconds: 3

  - name: oversaturated
    title: Перегруженный перекрёсток
    description: Все направления получают высокую интенсивность 9 автомобилей в минуту.
    intersection:
      lanes:
        north: {arrival_rate_per_minute: 9}
        south: {arrival_rate_per_minute: 9}
        east: {arrival_rate_per_minute: 9}
        west: {arrival_rate_per_minute: 9}
      min_green_seconds: 15
      yellow_seconds: 3

controllers:
  - type: fixed
    phase_duration_seconds: 35
  - type: actuated
    decision_interval_seconds: 10
  - type: ai
    decision_interval_seconds: 10

output:
  path: outputs/experiment_suite_results.json
  summary_csv: outputs/experiment_suite_summary.csv
  report_markdown: outputs/experiment_suite_report.md
