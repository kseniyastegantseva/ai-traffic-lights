name: queue_based_adaptive_development_1800
title: Queue-based adaptive minimum development, 1800 s
description: Second development stage on untouched seeds 801–815. The constant-minimum screen showed a
  material low-demand penalty and was not selected. This screen tests base min-green 8 s with congestion-triggered
  longer holds. The final seed set 1001–1030 remains untouched.
simulation:
  duration_seconds: 1800
  seeds:
  - 801
  - 802
  - 803
  - 804
  - 805
  - 806
  - 807
  - 808
  - 809
  - 810
  - 811
  - 812
  - 813
  - 814
  - 815
  service_time_seconds: 2.0
  store_queue_series: false
scenarios:
- name: symmetric
  title: Симметричный спрос
  description: 6 автомобилей в минуту на каждом подходе.
  intersection:
    lanes:
      north:
        arrival_rate_per_minute: 6
      south:
        arrival_rate_per_minute: 6
      east:
        arrival_rate_per_minute: 6
      west:
        arrival_rate_per_minute: 6
    min_green_seconds: 8
    yellow_seconds: 3
- name: symmetric_low
  title: Низкий симметричный спрос
  description: 3 автомобиля в минуту на каждом подходе.
  intersection:
    lanes:
      north:
        arrival_rate_per_minute: 3
      south:
        arrival_rate_per_minute: 3
      east:
        arrival_rate_per_minute: 3
      west:
        arrival_rate_per_minute: 3
    min_green_seconds: 8
    yellow_seconds: 3
- name: high_load
  title: Высокая нагрузка
  description: 18 автомобилей в минуту на каждом подходе; v/c оценивается относительно расчетной мощности
    модели и должна быть подтверждена результатами очередей.
  intersection:
    lanes:
      north:
        arrival_rate_per_minute: 18
      south:
        arrival_rate_per_minute: 18
      east:
        arrival_rate_per_minute: 18
      west:
        arrival_rate_per_minute: 18
    min_green_seconds: 8
    yellow_seconds: 3
- name: true_oversaturated
  title: Насыщенный спрос 24 авто/мин
  description: 24 автомобиля в минуту на каждом подходе; явно сверх расчётной пропускной способности модели.
  intersection:
    lanes:
      north:
        arrival_rate_per_minute: 24
      south:
        arrival_rate_per_minute: 24
      east:
        arrival_rate_per_minute: 24
      west:
        arrival_rate_per_minute: 24
    min_green_seconds: 8
    yellow_seconds: 3
