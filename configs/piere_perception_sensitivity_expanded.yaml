name: piere_perception_sensitivity_expanded
title: Sensitivity to queue-count errors across demand regimes
description: >-
  Five demand regimes, four reproducible observation-error levels, and 30 seeds.
  Only controller observations are perturbed; the generated arrival streams and
  physical queues remain unchanged across error levels for each regime and seed.
simulation:
  duration_seconds: 1800
  seeds: [201, 202, 203, 204, 205, 206, 207, 208, 209, 210, 211, 212, 213, 214, 215, 216, 217, 218, 219, 220, 221, 222, 223, 224, 225, 226, 227, 228, 229, 230]
  service_time_seconds: 2.0
controllers:
  - type: vehicle_actuated
  - type: queue_based
output:
  path: outputs/piere_perception_sensitivity_expanded.json
  summary_csv: outputs/piere_perception_sensitivity_expanded_summary.csv
  report_markdown: outputs/piere_perception_sensitivity_expanded_report.md
scenarios:
  - {name: symmetric_0pct, title: Симметричный спрос, ошибка 0%, observation_error_rate: 0.0, intersection: &symmetric {lanes: {north: {arrival_rate_per_minute: 6}, south: {arrival_rate_per_minute: 6}, east: {arrival_rate_per_minute: 6}, west: {arrival_rate_per_minute: 6}}, min_green_seconds: 8, yellow_seconds: 3}}
  - {name: symmetric_5pct, title: Симметричный спрос, ошибка 5%, observation_error_rate: 0.05, intersection: *symmetric}
  - {name: symmetric_10pct, title: Симметричный спрос, ошибка 10%, observation_error_rate: 0.1, intersection: *symmetric}
  - {name: symmetric_20pct, title: Симметричный спрос, ошибка 20%, observation_error_rate: 0.2, intersection: *symmetric}
  - {name: asymmetric_ns_0pct, title: Асимметричный N/S, ошибка 0%, observation_error_rate: 0.0, intersection: &asymmetric {lanes: {north: {arrival_rate_per_minute: 10}, south: {arrival_rate_per_minute: 10}, east: {arrival_rate_per_minute: 4}, west: {arrival_rate_per_minute: 4}}, min_green_seconds: 8, yellow_seconds: 3}}
  - {name: asymmetric_ns_5pct, title: Асимметричный N/S, ошибка 5%, observation_error_rate: 0.05, intersection: *asymmetric}
  - {name: asymmetric_ns_10pct, title: Асимметричный N/S, ошибка 10%, observation_error_rate: 0.1, intersection: *asymmetric}
  - {name: asymmetric_ns_20pct, title: Асимметричный N/S, ошибка 20%, observation_error_rate: 0.2, intersection: *asymmetric}
  - name: variable_demand_0pct
    title: Переменный спрос, ошибка 0%
    observation_error_rate: 0.0
    intersection: &variable {lanes: {north: {arrival_rate_per_minute: 6}, south: {arrival_rate_per_minute: 6}, east: {arrival_rate_per_minute: 6}, west: {arrival_rate_per_minute: 6}}, min_green_seconds: 8, yellow_seconds: 3}
    demand_schedule: &variable_schedule
      - {start_seconds: 0, end_seconds: 900, lanes: {north: {arrival_rate_per_minute: 6}, south: {arrival_rate_per_minute: 6}, east: {arrival_rate_per_minute: 6}, west: {arrival_rate_per_minute: 6}}}
      - {start_seconds: 900, end_seconds: 3600, lanes: {north: {arrival_rate_per_minute: 3}, south: {arrival_rate_per_minute: 3}, east: {arrival_rate_per_minute: 12}, west: {arrival_rate_per_minute: 12}}}
  - {name: variable_demand_5pct, title: Переменный спрос, ошибка 5%, observation_error_rate: 0.05, intersection: *variable, demand_schedule: *variable_schedule}
  - {name: variable_demand_10pct, title: Переменный спрос, ошибка 10%, observation_error_rate: 0.1, intersection: *variable, demand_schedule: *variable_schedule}
  - {name: variable_demand_20pct, title: Переменный спрос, ошибка 20%, observation_error_rate: 0.2, intersection: *variable, demand_schedule: *variable_schedule}
  - name: dominance_switch_0pct
    title: Смена доминирующей оси, ошибка 0%
    observation_error_rate: 0.0
    intersection: &switch {lanes: {north: {arrival_rate_per_minute: 10}, south: {arrival_rate_per_minute: 10}, east: {arrival_rate_per_minute: 4}, west: {arrival_rate_per_minute: 4}}, min_green_seconds: 8, yellow_seconds: 3}
    demand_schedule: &switch_schedule
      - {start_seconds: 0, end_seconds: 900, lanes: {north: {arrival_rate_per_minute: 10}, south: {arrival_rate_per_minute: 10}, east: {arrival_rate_per_minute: 4}, west: {arrival_rate_per_minute: 4}}}
      - {start_seconds: 900, end_seconds: 3600, lanes: {north: {arrival_rate_per_minute: 4}, south: {arrival_rate_per_minute: 4}, east: {arrival_rate_per_minute: 10}, west: {arrival_rate_per_minute: 10}}}
  - {name: dominance_switch_5pct, title: Смена доминирующей оси, ошибка 5%, observation_error_rate: 0.05, intersection: *switch, demand_schedule: *switch_schedule}
  - {name: dominance_switch_10pct, title: Смена доминирующей оси, ошибка 10%, observation_error_rate: 0.1, intersection: *switch, demand_schedule: *switch_schedule}
  - {name: dominance_switch_20pct, title: Смена доминирующей оси, ошибка 20%, observation_error_rate: 0.2, intersection: *switch, demand_schedule: *switch_schedule}
  - {name: high_load_0pct, title: Высокая нагрузка, ошибка 0%, observation_error_rate: 0.0, intersection: &high_load {lanes: {north: {arrival_rate_per_minute: 18}, south: {arrival_rate_per_minute: 18}, east: {arrival_rate_per_minute: 18}, west: {arrival_rate_per_minute: 18}}, min_green_seconds: 8, yellow_seconds: 3}}
  - {name: high_load_5pct, title: Высокая нагрузка, ошибка 5%, observation_error_rate: 0.05, intersection: *high_load}
  - {name: high_load_10pct, title: Высокая нагрузка, ошибка 10%, observation_error_rate: 0.1, intersection: *high_load}
  - {name: high_load_20pct, title: Высокая нагрузка, ошибка 20%, observation_error_rate: 0.2, intersection: *high_load}
