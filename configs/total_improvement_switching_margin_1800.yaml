name: total_improvement_switching_margin_1800
title: Абсолютные, относительные и временные пороги переключения, 1800 с
description: Paired development screen on new seeds 8101–8130. Compares absolute and relative queue margins,
  including zero/low/high values and a time-decaying margin that relaxes after effective minimum green.
  Original Queue-based and Vehicle-actuated references are included.
simulation:
  duration_seconds: 1800
  seeds:
  - 8101
  - 8102
  - 8103
  - 8104
  - 8105
  - 8106
  - 8107
  - 8108
  - 8109
  - 8110
  - 8111
  - 8112
  - 8113
  - 8114
  - 8115
  - 8116
  - 8117
  - 8118
  - 8119
  - 8120
  - 8121
  - 8122
  - 8123
  - 8124
  - 8125
  - 8126
  - 8127
  - 8128
  - 8129
  - 8130
  service_time_seconds: 2.0
  store_queue_series: false
scenarios:
- name: asymmetric_ns
  title: Асимметричный спрос Север–Юг
  description: 10 автомобилей в минуту на N/S и 4 на E/W.
  intersection:
    lanes:
      north:
        arrival_rate_per_minute: 10
      south:
        arrival_rate_per_minute: 10
      east:
        arrival_rate_per_minute: 4
      west:
        arrival_rate_per_minute: 4
    min_green_seconds: 8
    yellow_seconds: 3
- name: sudden_dominance_switch
  title: Внезапная смена доминирующей оси
  description: В 900 s максимум спроса переходит с N/S на E/W.
  intersection:
    lanes:
      north:
        arrival_rate_per_minute: 10
      south:
        arrival_rate_per_minute: 10
      east:
        arrival_rate_per_minute: 4
      west:
        arrival_rate_per_minute: 4
    min_green_seconds: 8
    yellow_seconds: 3
  demand_schedule:
  - start_seconds: 0
    end_seconds: 900
    lanes:
      north:
        arrival_rate_per_minute: 10
      south:
        arrival_rate_per_minute: 10
      east:
        arrival_rate_per_minute: 4
      west:
        arrival_rate_per_minute: 4
  - start_seconds: 900
    end_seconds: 3600
    lanes:
      north:
        arrival_rate_per_minute: 4
      south:
        arrival_rate_per_minute: 4
      east:
        arrival_rate_per_minute: 10
      west:
        arrival_rate_per_minute: 10
- name: high_load
  title: Высокая нагрузка
  description: 18 автомобилей в минуту на каждом подходе; v/c оценивается относительно расчетной мощности
    модели и должна быть подтверждена результатами очередей.
  intersection:
    lanes:
      north:
        arrival_rate_per_minute: 18
      south:
        arrival_rate_per_minute: 18
      east:
        arrival_rate_per_minute: 18
      west:
        arrival_rate_per_minute: 18
    min_green_seconds: 8
    yellow_seconds: 3
- name: symmetric_low
  title: Низкий симметричный спрос
  description: 3 автомобиля в минуту на каждом подходе.
  intersection:
    lanes:
      north:
        arrival_rate_per_minute: 3
      south:
        arrival_rate_per_minute: 3
      east:
        arrival_rate_per_minute: 3
      west:
        arrival_rate_per_minute: 3
    min_green_seconds: 8
    yellow_seconds: 3
- name: symmetric_9
  title: Симметричный спрос 9 авто/мин
  description: 9 автомобилей в минуту на каждом подходе; режим ниже прежнего кандидата перегрузки 18 авто/мин.
  intersection:
    lanes:
      north:
        arrival_rate_per_minute: 9
      south:
        arrival_rate_per_minute: 9
      east:
        arrival_rate_per_minute: 9
      west:
        arrival_rate_per_minute: 9
    min_green_seconds: 8
    yellow_seconds: 3
- name: asymmetric_ew
  title: Асимметричный спрос Восток–Запад
  description: 4 автомобиля в минуту на N/S и 10 на E/W; зеркальный сценарий к asymmetric_ns.
  intersection:
    lanes:
      north:
        arrival_rate_per_minute: 4
      south:
        arrival_rate_per_minute: 4
      east:
        arrival_rate_per_minute: 10
      west:
        arrival_rate_per_minute: 10
    min_green_seconds: 8
    yellow_seconds: 3
- name: true_oversaturated
  title: Насыщенный спрос 24 авто/мин
  description: 24 автомобиля в минуту на каждом подходе; явно сверх расчётной пропускной способности модели.
  intersection:
    lanes:
      north:
        arrival_rate_per_minute: 24
      south:
        arrival_rate_per_minute: 24
      east:
        arrival_rate_per_minute: 24
      west:
        arrival_rate_per_minute: 24
    min_green_seconds: 8
    yellow_seconds: 3
controllers:
- type: vehicle_actuated
  min_green_seconds: 8
  max_green_seconds: 45
- type: queue_based
  min_green_seconds: 8
  max_green_seconds: 45
  switching_margin: 1
- type: queue_based_improved
  min_green_seconds: 8
  max_green_seconds: 45
  switching_margin: 1
  relative_switching_margin: 0.1
  congested_min_green_seconds: 25
  congestion_queue_threshold: 14
  result_name: improved_abs1_rel010
- type: queue_based_improved
  min_green_seconds: 8
  max_green_seconds: 45
  switching_margin: 0
  relative_switching_margin: 0.0
  congested_min_green_seconds: 25
  congestion_queue_threshold: 14
  result_name: margin_abs0_rel000
- type: queue_based_improved
  min_green_seconds: 8
  max_green_seconds: 45
  switching_margin: 1
  relative_switching_margin: 0.0
  congested_min_green_seconds: 25
  congestion_queue_threshold: 14
  result_name: margin_abs1_rel000
- type: queue_based_improved
  min_green_seconds: 8
  max_green_seconds: 45
  switching_margin: 2
  relative_switching_margin: 0.0
  congested_min_green_seconds: 25
  congestion_queue_threshold: 14
  result_name: margin_abs2_rel000
- type: queue_based_improved
  min_green_seconds: 8
  max_green_seconds: 45
  switching_margin: 1
  relative_switching_margin: 0.2
  congested_min_green_seconds: 25
  congestion_queue_threshold: 14
  result_name: margin_abs1_rel020
- type: queue_based_elapsed_margin
  min_green_seconds: 8
  max_green_seconds: 45
  switching_margin: 1
  relative_switching_margin: 0.2
  congested_min_green_seconds: 25
  congestion_queue_threshold: 14
  switching_margin_decay_per_second: 0.025
  minimum_switching_margin: 1
  result_name: margin_elapsed_decay_0025
output:
  path: outputs/total_improvement/switching_margin_1800.json
  summary_csv: outputs/total_improvement/switching_margin_1800_summary.csv
  report_markdown: outputs/total_improvement/switching_margin_1800_report.md
