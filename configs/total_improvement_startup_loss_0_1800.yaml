name: total_improvement_startup_loss_0_1800
title: Startup lost time 0 s sensitivity, 1800 s
description: Paired sensitivity of a separately modeled phase startup delay. Saturation service headway
  stays 2 s, yellow clearance stays 3 s, and dynamic all-red only clears active service. All policies
  share the same arrivals within each scenario/seed; these sensitivity seeds do not tune controller parameters.
simulation:
  duration_seconds: 1800
  seeds:
  - 11101
  - 11102
  - 11103
  - 11104
  - 11105
  - 11106
  - 11107
  - 11108
  - 11109
  - 11110
  - 11111
  - 11112
  - 11113
  - 11114
  - 11115
  - 11116
  - 11117
  - 11118
  - 11119
  - 11120
  - 11121
  - 11122
  - 11123
  - 11124
  - 11125
  - 11126
  - 11127
  - 11128
  - 11129
  - 11130
  service_time_seconds: 2.0
  startup_lost_time_seconds: 0.0
  store_queue_series: false
scenarios:
- name: symmetric
  title: Симметричный спрос
  description: 6 автомобилей в минуту на каждом подходе.
  intersection:
    lanes:
      north:
        arrival_rate_per_minute: 6
      south:
        arrival_rate_per_minute: 6
      east:
        arrival_rate_per_minute: 6
      west:
        arrival_rate_per_minute: 6
    min_green_seconds: 8
    yellow_seconds: 3
- name: asymmetric_ns
  title: Асимметричный спрос Север–Юг
  description: 10 автомобилей в минуту на N/S и 4 на E/W.
  intersection:
    lanes:
      north:
        arrival_rate_per_minute: 10
      south:
        arrival_rate_per_minute: 10
      east:
        arrival_rate_per_minute: 4
      west:
        arrival_rate_per_minute: 4
    min_green_seconds: 8
    yellow_seconds: 3
- name: sudden_dominance_switch
  title: Внезапная смена доминирующей оси
  description: В 900 s максимум спроса переходит с N/S на E/W.
  intersection:
    lanes:
      north:
        arrival_rate_per_minute: 10
      south:
        arrival_rate_per_minute: 10
      east:
        arrival_rate_per_minute: 4
      west:
        arrival_rate_per_minute: 4
    min_green_seconds: 8
    yellow_seconds: 3
  demand_schedule:
  - start_seconds: 0
    end_seconds: 900
    lanes:
      north:
        arrival_rate_per_minute: 10
      south:
        arrival_rate_per_minute: 10
      east:
        arrival_rate_per_minute: 4
      west:
        arrival_rate_per_minute: 4
  - start_seconds: 900
    end_seconds: 3600
    lanes:
      north:
        arrival_rate_per_minute: 4
      south:
        arrival_rate_per_minute: 4
      east:
        arrival_rate_per_minute: 10
      west:
        arrival_rate_per_minute: 10
- name: high_load
  title: Высокая нагрузка
  description: 18 автомобилей в минуту на каждом подходе; v/c оценивается относительно расчетной мощности
    модели и должна быть подтверждена результатами очередей.
  intersection:
    lanes:
      north:
        arrival_rate_per_minute: 18
      south:
        arrival_rate_per_minute: 18
      east:
        arrival_rate_per_minute: 18
      west:
        arrival_rate_per_minute: 18
    min_green_seconds: 8
    yellow_seconds: 3
- name: symmetric_low
  title: Низкий симметричный спрос
  description: 3 автомобиля в минуту на каждом подходе.
  intersection:
    lanes:
      north:
        arrival_rate_per_minute: 3
      south:
        arrival_rate_per_minute: 3
      east:
        arrival_rate_per_minute: 3
      west:
        arrival_rate_per_minute: 3
    min_green_seconds: 8
    yellow_seconds: 3
- name: symmetric_9
  title: Симметричный спрос 9 авто/мин
  description: 9 автомобилей в минуту на каждом подходе; режим ниже прежнего кандидата перегрузки 18 авто/мин.
  intersection:
    lanes:
      north:
        arrival_rate_per_minute: 9
      south:
        arrival_rate_per_minute: 9
      east:
        arrival_rate_per_minute: 9
      west:
        arrival_rate_per_minute: 9
    min_green_seconds: 8
    yellow_seconds: 3
- name: asymmetric_ew
  title: Асимметричный спрос Восток–Запад
  description: 4 автомобиля в минуту на N/S и 10 на E/W; зеркальный сценарий к asymmetric_ns.
  intersection:
    lanes:
      north:
        arrival_rate_per_minute: 4
      south:
        arrival_rate_per_minute: 4
      east:
        arrival_rate_per_minute: 10
      west:
        arrival_rate_per_minute: 10
    min_green_seconds: 8
    yellow_seconds: 3
- name: true_oversaturated
  title: Насыщенный спрос 24 авто/мин
  description: 24 автомобиля в минуту на каждом подходе; явно сверх расчётной пропускной способности модели.
  intersection:
    lanes:
      north:
        arrival_rate_per_minute: 24
      south:
        arrival_rate_per_minute: 24
      east:
        arrival_rate_per_minute: 24
      west:
        arrival_rate_per_minute: 24
    min_green_seconds: 8
    yellow_seconds: 3
