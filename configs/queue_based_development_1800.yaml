name: queue_based_development_1800
title: Queue-based controller development, 1800 s
description: 'Development-only parameter screen. Seeds 701–715 are excluded from final validation. Predeclared
  eligibility: at 18 and 24 vehicles/min/approach, mean queue area and residual must be lower and throughput
  no lower than original; at symmetric 3 and 6, completed wait and mean queue may not worsen by more than
  10%. Among eligible variants, choose the lowest 18/min mean queue area; ties prefer the smaller relative
  margin, then shorter minimum green. The final seed set is untouched during selection.'
simulation:
  duration_seconds: 1800
  seeds:
  - 701
  - 702
  - 703
  - 704
  - 705
  - 706
  - 707
  - 708
  - 709
  - 710
  - 711
  - 712
  - 713
  - 714
  - 715
  service_time_seconds: 2.0
  store_queue_series: false
scenarios:
- name: symmetric
  title: Симметричный спрос
  description: 6 автомобилей в минуту на каждом подходе.
  intersection:
    lanes:
      north:
        arrival_rate_per_minute: 6
      south:
        arrival_rate_per_minute: 6
      east:
        arrival_rate_per_minute: 6
      west:
        arrival_rate_per_minute: 6
    min_green_seconds: 8
    yellow_seconds: 3
- name: symmetric_low
  title: Низкий симметричный спрос
  description: 3 автомобиля в минуту на каждом подходе.
  intersection:
    lanes:
      north:
        arrival_rate_per_minute: 3
      south:
        arrival_rate_per_minute: 3
      east:
        arrival_rate_per_minute: 3
      west:
        arrival_rate_per_minute: 3
    min_green_seconds: 8
    yellow_seconds: 3
- name: high_load
  title: Высокая нагрузка
  description: 18 автомобилей в минуту на каждом подходе; v/c оценивается относительно расчетной мощности
    модели и должна быть подтверждена результатами очередей.
  intersection:
    lanes:
      north:
        arrival_rate_per_minute: 18
      south:
        arrival_rate_per_minute: 18
      east:
        arrival_rate_per_minute: 18
      west:
        arrival_rate_per_minute: 18
    min_green_seconds: 8
    yellow_seconds: 3
- name: true_oversaturated
  title: Насыщенный спрос 24 авто/мин
  description: 24 автомобиля в минуту на каждом подходе; явно сверх расчётной пропускной способности модели.
  intersection:
    lanes:
      north:
        arrival_rate_per_minute: 24
      south:
        arrival_rate_per_minute: 24
      east:
        arrival_rate_per_minute: 24
      west:
        arrival_rate_per_minute: 24
    min_green_seconds: 8
    yellow_seconds: 3
