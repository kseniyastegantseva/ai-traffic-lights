name: total_improvement_capacity_boundary_1800
title: Граница насыщения 9–18 авто/мин/подход, development, 1800 с
description: Paired exploratory load sweep across 9–18 vehicles/minute/approach on seeds 3101–3115. All
  controllers share arrivals within a demand/seed pair. The screen reports completed wait together with
  queue area, residual, throughput, switching, yellow and signal-red metrics; it is not an independent
  final test.
