services:
  sim:
    build:
      context: .
      target: base
    volumes:
      - .:/workspace
    command: traffic-sim compare --config configs/demo_uniform.yaml

  dashboard:
    build:
      context: .
      target: app
    volumes:
      - .:/workspace
    ports:
      - "8501:8501"
    command: streamlit run app/dashboard.py --server.address 0.0.0.0

  api:
    build:
      context: .
      target: app
    volumes:
      - .:/workspace
    ports:
      - "8000:8000"
    command: uvicorn app.api:app --host 0.0.0.0 --port 8000
